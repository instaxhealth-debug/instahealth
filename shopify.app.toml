# =============================================================================
# SHOPIFY PUBLIC APP CONFIGURATION
# =============================================================================
# This file is REQUIRED for Shopify App Store review and automated checks
# Documentation: https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration
# =============================================================================

# App identification (get these from Shopify Partner Dashboard)
name = "InstaHealth Marketplace"
client_id = ""  # Set via SHOPIFY_API_KEY environment variable
scopes = "read_products,read_inventory,read_orders"

# Application URLs
application_url = "https://instahealth.ae/shopify"
embedded = true

# =============================================================================
# MANDATORY COMPLIANCE WEBHOOKS (CRITICAL FOR APP STORE APPROVAL)
# =============================================================================
# Shopify requires ALL public apps to handle these GDPR compliance webhooks
# Even if your app doesn't store customer PII, you must respond with 200 OK
# Invalid HMAC must return 401 Unauthorized
# =============================================================================

[webhooks]
api_version = "2024-10"

# GDPR Compliance Webhooks - customers/data_request
# Customer requests access to their data (GDPR Article 15)
[[webhooks.subscriptions]]
topics = ["customers/data_request"]
uri = "/api/shopify/compliance"

# GDPR Compliance Webhooks - customers/redact
# Customer requests data deletion (GDPR Article 17 - Right to be forgotten)
[[webhooks.subscriptions]]
topics = ["customers/redact"]
uri = "/api/shopify/compliance"

# GDPR Compliance Webhooks - shop/redact
# Shop uninstalled - delete all shop data within 48 hours
[[webhooks.subscriptions]]
topics = ["shop/redact"]
uri = "/api/shopify/compliance"

# =============================================================================
# OPTIONAL: PRODUCT SYNC WEBHOOKS
# =============================================================================
# These are auto-registered at runtime via registerWebhooks() function
# Including here for documentation, but they will be registered dynamically
# to allow per-shop customization
# =============================================================================

# Product lifecycle webhooks (auto-registered after OAuth)
# [[webhooks.subscriptions]]
# topics = ["products/create", "products/update", "products/delete"]
# uri = "/api/shopify/webhooks"

# App uninstall webhook (auto-registered after OAuth)
# [[webhooks.subscriptions]]
# topics = ["app/uninstalled"]
# uri = "/api/shopify/webhooks"

# =============================================================================
# ACCESS SCOPES
# =============================================================================
# These must match the scopes set in Shopify Partner Dashboard

[access_scopes]
scopes = "read_products,read_inventory,read_orders"

# =============================================================================
# AUTH CONFIGURATION
# =============================================================================

[auth]
redirect_urls = [
  "https://instahealth.ae/api/shopify/callback",
  "https://instahealth.ae/admin/oauth/redirect_to_install",
  "http://localhost:3000/api/shopify/callback",  # Development only
  "http://localhost:3000/admin/oauth/redirect_to_install"  # Development only
]

# =============================================================================
# APP PROXY (if needed in future)
# =============================================================================
# Uncomment and configure if you need storefront proxy endpoints
# [app_proxy]
# url = "https://instahealth.ae/api/shopify/proxy"
# subpath = "instahealth"
# prefix = "apps"

# =============================================================================
# POS (if needed in future)
# =============================================================================
# [pos]
# embedded = false
